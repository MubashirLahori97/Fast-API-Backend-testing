services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: genesis_local_only
      POSTGRES_DB: genesis_health
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # A local test inbox: catches every email the backend sends (EMAIL_BACKEND=smtp) and shows
  # it at http://localhost:8025. Nothing is delivered to real addresses.
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:1025:1025" # SMTP, for the backend
      - "127.0.0.1:8025:8025" # the web inbox

volumes:
  db_data:
